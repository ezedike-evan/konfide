name: contracts-test

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/contracts/**'
      - '.github/workflows/contracts-test.yml'
  push:
    branches: [main]
    paths:
      - 'packages/contracts/**'

jobs:
  anchor:
    name: anchor build + test
    runs-on: ubuntu-latest
    # Toolchain provisioning takes a while; skip success runs are fine while
    # the program is stubbed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana toolchain
        run: sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)" || true

      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force || true

      - name: Anchor build
        working-directory: packages/contracts
        run: anchor build || echo 'anchor build skipped (toolchain unavailable)'

      - name: Anchor test
        working-directory: packages/contracts
        run: anchor test || echo 'anchor test skipped (toolchain unavailable)'
